[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-volatility-lab"
version = "0.2.0"
description = "Portfolio Risk Lab: forecasting, risk targeting and cost-aware historical decision experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "scikit-learn>=1.4", "torch>=2.2", "yfinance>=0.2.54", "requests>=2.31", "matplotlib>=3.8", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
volrisk = "volrisk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
volrisk = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
